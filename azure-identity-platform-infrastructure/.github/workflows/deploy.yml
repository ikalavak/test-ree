name: Bicep CI/CD

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

env:
  AZURE_RESOURCE_GROUP: 'rg-identity-platform-demo'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Bicep
        uses: azure/setup-bicep@v1

      - name: Validate Bicep files
        run: |
          bicep build main.bicep

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment: ${{ github.event.pull_request != null && 'staging' || 'deployment' }}
    steps:
      - uses: actions/checkout@v4

      - name: Login to Azure with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: What-If (preview)
        run: |
          az deployment group what-if \
            --resource-group $AZURE_RESOURCE_GROUP \
            --template-file main.bicep \
            --parameters @environments/sandbox.bicepparam

      - name: Deploy (requires approval for prod)
        if: github.ref == 'refs/heads/main'
        run: |
          az deployment group create \
            --resource-group $AZURE_RESOURCE_GROUP \
            --template-file main.bicep \
            --parameters @environments/sandbox.bicepparam
name: Deploy Azure Identity Platform Infrastructure

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy'
        required: true
        type: choice
        options:
          - sandbox
          - nonprod
          - prod

permissions:
  id-token: write
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Azure CLI
        uses: azure/setup-azure@v2

      - name: Install Bicep CLI
        run: az bicep install

      - name: Bicep build
        run: az bicep build --file main.bicep

      - name: Validate parameter files
        run: |
          ls environments
          for f in environments/*.bicepparam; do
            echo "Checking $f"
            az bicep build-params --file "$f"
          done

  what-if:
    needs: validate
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'sandbox' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Azure login with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: What-if deployment
        run: |
          az deployment sub what-if \
            --location eastus \
            --template-file main.bicep \
            --parameters @environments/${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'sandbox' }}.bicepparam

  deploy:
    needs: what-if
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Azure login with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy infrastructure
        run: |
          az deployment sub create \
            --location eastus \
            --template-file main.bicep \
            --parameters @environments/${{ inputs.environment }}.bicepparam
